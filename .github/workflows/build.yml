name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the workflow publishes the release itself

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Only what the build uses. reference/ is third-party code we read and never build or run; one of its Gradle
      # wrapper jars (timelapse-sony) is not on Gradle's list, and the wrapper check stopped every build before
      # 1.11.2026. Left out of the checkout, the check stays on for everything the runner does have.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            app
            site
            tools

      # The signing key lives only in the repository secrets (public repo since 14.11.2026), never in git.
      - name: Write the signing key from the secrets
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          mkdir -p signing
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 -d > signing/test-builds.p12
          test -s signing/test-builds.p12

      - name: Read the version
        id: version
        run: echo "v=$(grep -oP '^appVersion=\K\d+' gradle.properties)" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unit tests
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          gradle assembleDebug --stacktrace
          V=${{ steps.version.outputs.v }}
          cp app/build/outputs/apk/debug/app-debug.apk "$V-sony-remote-v$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sony-remote-v${{ steps.version.outputs.v }}
          path: ${{ steps.version.outputs.v }}-sony-remote-v${{ steps.version.outputs.v }}.apk
          if-no-files-found: error

      # A release per version, so the phone downloads the APK without a token. Keeps the last two.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.v }}
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" "$V-sony-remote-v$V.apk" --latest --target "$GITHUB_SHA" \
            --title "v$V" --notes "Sony Remote v$V, test build from ${GITHUB_REF_NAME}. Signed with the test-builds key, so it installs over any earlier build."
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+$' | sort -t v -k2 -n -r | tail -n +3 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag 2>/dev/null || true; done

      # The page gets exactly this release, by itself (MANTRA_MANIFEST download-always-latest.md, 1.11.2026):
      # download/SonyRemote.apk, an address with no version, plus the version and date written into the page.
      # Only from the default branch; a test branch's build stays a release for the phone, not on the public page.
      - name: Put the release on the page
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets not set, the page was not updated."; exit 0
          fi
          V=${{ steps.version.outputs.v }}
          mkdir -p released && gh release download "v$V" --pattern "$V-sony-remote-v$V.apk" --dir released --clobber
          bash tools/publish_page.sh "released/$V-sony-remote-v$V.apk" "$V" "$(date -u +%-d.%-m.%Y)"
          # Checked by the live page (download-always-latest.md §5): the button's address serves this very release.
          for i in $(seq 12); do
            curl -sfL -o live.apk https://mantrasonyremote.pages.dev/download/SonyRemote.apk || true
            cmp -s live.apk "released/$V-sony-remote-v$V.apk" && break; sleep 15
          done
          cmp "released/$V-sony-remote-v$V.apk" live.apk
          echo "live: download/SonyRemote.apk = $(stat -c%s live.apk) bytes, identical to release v$V"
          # Read the page whole first: grep -q closing the pipe early made curl exit 23 under pipefail.
          PAGE_NOW=$(curl -sf https://mantrasonyremote.pages.dev/)
          grep -c "app-version\">$V<" <<< "$PAGE_NOW" >/dev/null && echo "live: the page shows v$V"
